<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>musicna — 실시간</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .live-wrap { max-width: 1100px; margin: 0 auto; padding: 20px 24px 48px; }
    .live-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .live-dot.on { background: var(--sec-solo); }
    .chord-now {
      font-size: 64px; font-weight: 700; line-height: 1.1;
      min-height: 76px; font-variant-numeric: tabular-nums;
    }
    .chord-history { color: var(--ink-2); font-size: 15px; min-height: 24px; }
    .chord-history b { color: var(--ink); }
    #roll { width: 100%; height: 320px; display: block; border-radius: 6px; }
    .roll-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
    .topbar a { color: var(--ink-2); text-decoration: none; font-size: 13px; }
    .topbar a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>musicna</h1>
    <a href="/">라이브러리</a>
    <span class="live-status" style="margin-left:auto">
      <span id="dot" class="live-dot"></span><span id="conn">연결 중…</span>
    </span>
  </header>

  <main class="live-wrap">
    <section class="panel">
      <h3>현재 코드</h3>
      <div id="chord-now" class="chord-now muted">—</div>
      <div id="chord-history" class="chord-history"></div>
    </section>

    <section class="panel">
      <h3>피아노 롤 (최근 30초)</h3>
      <canvas id="roll"></canvas>
      <div class="roll-meta"><span id="clock">0:00</span><span id="note-count">노트 0</span></div>
    </section>

    <p class="muted" style="font-size:12px">
      macOS에서 <code>musicna-capture | uv run musicna-live</code>를 실행하면 이벤트가 표시됩니다.
    </p>
  </main>

  <script src="live.js"></script>
</body>
</html>
