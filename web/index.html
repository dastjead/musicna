<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>musicna — 라이브러리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>musicna</h1>
    <span id="track-count" class="muted"></span>
    <a href="/live.html" style="margin-left:12px; font-size:13px; color:var(--ink-2)">실시간</a>
    <button id="refresh" type="button">새로고침</button>
  </header>

  <main class="layout">
    <nav id="track-list" class="track-list" aria-label="트랙 목록"></nav>

    <section id="detail" class="detail">
      <p class="muted empty-hint">트랙을 선택하세요.</p>
    </section>
  </main>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
