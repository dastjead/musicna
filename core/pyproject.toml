[project]
name = "musicna-core"
version = "0.1.0"
description = "musicna 분석 코어 — 플랫폼 독립 파이프라인 (오디오 파일 in → 구조화된 분석 결과 out)"
# muscriptor가 Python 3.10~3.12 지원 → 3.13 미만으로 고정 (.python-version=3.12)
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "music21>=9",       # MIDI 키/코드 분석 (순수 Python이라 base에 포함)
]

# 무거운 ML 의존성은 extra로 분리한다 — 패키지명은 PyPI 실재 확인 완료 (2026-07-24)
[project.optional-dependencies]
transcribe = [
    "muscriptor>=0.2.2", # Phase 2: 오디오 → MIDI (Apple Metal 지원, 가중치는 HF 로그인 필요)
    # muscriptor의 torch<2.3 핀은 darwin x86_64 전용 — arm64는 MPS FFT(aten::_fft_r2c)가
    # 구현된 2.3+가 필요해 상한을 올린다 (없으면 uv가 전 플랫폼 공통 2.2.2로 하향 해석)
    "torch>=2.3; platform_machine == 'arm64'",
]
analyze = [
    "allin1>=1.1",       # Phase 3: 구조/BPM/비트 (madmom을 함께 끌어옴, macOS는 natten 자동 설치)
    "librosa>=0.10",     # Phase 3: chroma, 오디오 특성
    # chorder는 계획에 있었으나 MIDI 코드 추출을 music21 harmony로 구현하여 불필요 (analyze/chords.py)
]
mood = [
    "laion-clap>=1.1",   # Phase 3: zero-shot 무드 태깅
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicna_core"]
