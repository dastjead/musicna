[project]
name = "musicna-core"
version = "0.1.0"
description = "musicna 분석 코어 — 플랫폼 독립 파이프라인 (오디오 파일 in → 구조화된 분석 결과 out)"
# muscriptor가 Python 3.10~3.12 지원 → 3.13 미만으로 고정 (.python-version=3.12)
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "music21>=9",       # MIDI 키/코드 분석 (순수 Python이라 base에 포함)
]

# 무거운 ML 의존성은 extra로 분리한다 — 패키지명은 PyPI 실재 확인 완료 (2026-07-24)
[project.optional-dependencies]
transcribe = [
    "muscriptor>=0.2.2", # Phase 2: 오디오 → MIDI (Apple Metal 지원, 가중치는 HF 로그인 필요)
    # muscriptor의 torch<2.3 핀은 darwin x86_64 전용 — arm64는 MPS FFT(aten::_fft_r2c)가
    # 구현된 2.3+가 필요해 상한을 올린다 (없으면 uv가 전 플랫폼 공통 2.2.2로 하향 해석)
    "torch>=2.3; platform_machine == 'arm64'",
]
analyze = [
    "allin1>=1.1",       # Phase 3: 구조/BPM/비트 (macOS는 natten 자동 설치)
    # allin1은 madmom을 런타임 import하지만 의존성으로 선언하지 않음 — PyPI 0.16.1(2018)이
    # Python 3.12/신형 numpy 비호환이라 git 설치가 공식 안내 (커밋 고정으로 재현성 확보)
    "madmom @ git+https://github.com/CPJKU/madmom@27f032e8947204902c675e5e341a3faf5dc86dae",
    # allin1의 dinat 모델은 natten 구 함수형 API(natten1dav 등)를 사용 — 0.17에서 제거됨.
    # 0.14.x는 torch 2.13 헤더와 C++ 컴파일 불가, 0.15.x가 구 API를 가진 마지막 빌드 가능 계열.
    # 소스 빌드라 venv에 torch·cmake·ninja 선존재 필요(no-build-isolation): 신규 머신은
    # ① --extra transcribe로 torch 먼저 ② uv pip install cmake ninja ③ --extra analyze 순서로.
    # torch 2.13에서 제거된 torch.cuda._device_t는 analyze/_patch_natten_torch_compat가 재주입.
    "natten>=0.15,<0.17; platform_system == 'Darwin'",
    "librosa>=0.10",     # Phase 3: chroma, 오디오 특성
    # chorder는 계획에 있었으나 MIDI 코드 추출을 music21 harmony로 구현하여 불필요 (analyze/chords.py)
]
mood = [
    "laion-clap>=1.1",   # Phase 3: zero-shot 무드 태깅
    "torchvision",       # laion-clap이 런타임 import하지만 의존성 미선언 (torch와 버전 자동 정합)
]
chroma = [
    "librosa>=0.10",     # 오디오 코드 교차 검증만 필요할 때 — analyze 전체(allin1 등) 없이 설치 가능
]

[dependency-groups]
# librosa는 chroma 교차 검증 테스트용 (합성 WAV fixture) — Linux CI에서도 설치 가능한 경량 스택
dev = ["pytest>=8", "librosa>=0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicna_core"]

# analyze extra의 madmom git 직접 참조 허용 (hatchling 기본값은 거부)
[tool.hatch.metadata]
allow-direct-references = true
