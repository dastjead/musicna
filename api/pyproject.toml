[project]
name = "musicna-api"
version = "0.1.0"
description = "musicna API 서버 — core를 REST/WebSocket으로 노출하는 유일한 진입점 (웹/iOS 클라이언트 공용)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "musicna-core",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12",  # uvicorn의 /ws/live 지원 (기본 uvicorn에는 WS 백엔드 없음)
    "numpy>=1.26",  # 세션 매니저 PCM 처리
]

[project.scripts]
musicna-session = "musicna_api.session.cli:main"
musicna-analyze = "musicna_api.batch:main"
musicna-live = "musicna_api.live_cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv.sources]
musicna-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicna_api"]
