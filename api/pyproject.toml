[project]
name = "musicna-api"
version = "0.1.0"
description = "musicna API 서버 — core를 REST/WebSocket으로 노출하는 유일한 진입점 (웹/iOS 클라이언트 공용)"
requires-python = ">=3.11"
dependencies = [
    "musicna-core",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "numpy>=1.26",  # 세션 매니저 PCM 처리
]

[project.scripts]
musicna-session = "musicna_api.session.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
musicna-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicna_api"]
