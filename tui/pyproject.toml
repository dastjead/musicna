[project]
name = "musicna-tui"
version = "0.1.0"
description = "musicna 터미널 UI — api만 호출하는 독립 클라이언트 (Phase 7~)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "textual>=0.60",
    "httpx>=0.28",
]

[project.scripts]
musicna-tui = "musicna_tui.app:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicna_tui"]
